<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height, viewport-fit=cover">
    <title>Sign Up · Little Warriors Martial Arts</title>
    <!-- Little Warriors favicon (fist) -->
<!-- Favicon (martial arts belt / star) -->
  <link rel="icon" type="image/svg+xml" href="assest/favicon.svg">
    <!-- Tailwind CSS -->
    <script src="tailwind.js"></script>
    <script>
        if (typeof tailwind === 'undefined') {
            document.write('<script src="https://cdn.tailwindcss.com"><\/script>');
        }
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'dojo-red': '#B22222',
                        'dojo-red-light': '#D44A4A',
                        'dojo-red-dark': '#7A1A1A',
                        'dojo-gold': '#D4AF37',
                        'dojo-parchment': '#FDF8F0',
                        'dojo-ink': '#1E1E1E',
                        'dojo-sand': '#EAE0D0',
                        'dojo-blue': '#1F3A5F',
                        'dojo-blue-light': '#2F5A8F',
                        'dojo-wood': '#8B5E3C',
                    },
                    fontFamily: {
                        'serif': ['Libre Baskerville', 'Georgia', 'serif'],
                        'heading': ['Playfair Display', 'serif'],
                        'body': ['Lato', 'system-ui', 'sans-serif'],
                        'script': ['Great Vibes', 'cursive'],
                        'alt-serif': ['Libre Baskerville', 'serif'],
                        'sans': ['Lato', 'Inter', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.2s ease-out',
                        'float': 'float 6s ease-in-out infinite'
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-6px)' } }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800;900&family=Lato:wght@300;400;700;900&family=Great+Vibes&family=Libre+Baskerville:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ----- NO SCROLL — fit exactly one screen ----- */
        html,
        body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #FFFFFF;
            color: #1E1E1E;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        p {
            line-height: 1.8;
            letter-spacing: 0.01em;
        }

        .dark body {
            background-color: #0A0A0A;
            color: #EDE4D8;
        }

        /* toggle buttons — positioned top-right */
        .theme-toggle-wrapper {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 8px;
        }

        .toggle-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #EAE0D0;
            color: #7A1A1A;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .dark .toggle-btn {
            background: #1A1A1A;
            color: #D4AF37;
        }

        .toggle-btn:hover {
            background: #B22222;
            color: #FFFFFF;
        }

        .dark .toggle-btn:hover {
            background: #D4AF37;
            color: #1E1E1E;
        }

        .toggle-btn.active {
            background: #B22222;
            color: #FFFFFF;
        }

        .dark .toggle-btn.active {
            background: #D4AF37;
            color: #1E1E1E;
        }

        /* SIGNUP CARD — dojo theme */
        .signup-card {
            background: #FFF8F0;
            border-radius: 32px;
            padding: 1.5rem 1.8rem 1.8rem;
            box-shadow: 0 20px 40px rgba(178, 34, 34, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            transition: background 0.2s ease;
        }

        .dark .signup-card {
            background: #121212;
            border-color: #B22222;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5);
        }

        /* input — dojo style */
        .signup-input {
            width: 100%;
            padding: 0.7rem 1.2rem 0.7rem 3rem;
            border-radius: 50px;
            border: 1px solid #EAE0D0;
            background: white;
            font-size: 0.9rem;
            transition: all 0.2s;
            color: #1E1E1E;
        }

        .dark .signup-input {
            background: #1E1E1E;
            border-color: rgba(234, 224, 208, 0.35);
            color: #EDE4D8;
        }

        .signup-input:focus {
            outline: none;
            border-color: #D4AF37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
        }

        .dark .signup-input:focus {
            border-color: #D4AF37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.25);
        }

        /* password wrapper for eye icon */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper .signup-input {
            padding-right: 3rem;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #7A1A1A;
            font-size: 0.95rem;
            transition: color 0.2s;
            background: transparent;
            border: none;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dark .toggle-password {
            color: #D4AF37;
        }

        .toggle-password:hover {
            color: #B22222;
        }

        .dark .toggle-password:hover {
            color: #D4AF37;
        }

        [dir="rtl"] .toggle-password {
            right: auto;
            left: 1rem;
        }

        [dir="rtl"] .password-wrapper .signup-input {
            padding-right: 1.2rem;
            padding-left: 3rem;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 1.1rem;
        }

        /* heritage button — dojo red */
        .heritage-btn {
            background: #B22222;
            color: white;
            font-weight: 600;
            padding: 0.7rem 1.5rem;
            border-radius: 50px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
        }

        .dark .heritage-btn {
            background: #D4AF37;
            color: #1E1E1E;
        }

        .heritage-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(178, 34, 34, 0.3);
        }

        .dark .heritage-btn:hover {
            box-shadow: 0 6px 18px rgba(212, 175, 55, 0.35);
        }

        /* social login buttons */
        .social-btn-row {
            display: flex;
            flex-direction: row;
            gap: 1rem;
            width: 100%;
            margin-top: 0.25rem;
        }

        .social-btn {
            flex: 1;
            padding: 0.6rem 0.5rem;
            border-radius: 50px;
            border: 1px solid #EAE0D0;
            background: white;
            color: #1E1E1E;
            font-weight: 500;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            gap: 0.5rem;
            cursor: pointer;
        }

        .dark .social-btn {
            background: #1E1E1E;
            border-color: #2F2F2F;
            color: #EDE4D8;
        }

        .social-btn:hover {
            background: #FDF8F0;
            border-color: #D4AF37;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }

        .dark .social-btn:hover {
            background: #1A1A1A;
            border-color: #D4AF37;
        }

        .social-btn i {
            font-size: 1.1rem;
            color: #B22222;
        }

        .dark .social-btn i {
            color: #D4AF37;
        }

        /* logo spin */
        .logo-icon {
            transition: transform 0.3s ease;
        }

        a:hover .logo-icon {
            transform: rotate(12deg);
        }

        /* RTL adjustments */
        [dir="rtl"] .signup-input {
            padding: 0.7rem 3rem 0.7rem 1.2rem;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 1.1rem;
        }

        [dir="rtl"] .fa-arrow-right {
            transform: scaleX(-1);
        }

        [dir="rtl"] .theme-toggle-wrapper {
            right: auto;
            left: 20px;
        }

        [dir="rtl"] .flex.space-x-2> :not([hidden])~ :not([hidden]) {
            margin-right: 0.5rem;
            margin-left: 0;
        }

        /* hidden utility */
        .hidden {
            display: none;
        }

        /* container */
        .container-tight {
            max-width: 480px;
            width: 100%;
            padding: 0 1.5rem;
        }

        /* center logo container */
        .logo-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
        }

        /* heritage line */
        .heritage-line {
            width: 50px;
            height: 2px;
            background: #D4AF37;
            margin: 0.5rem auto;
        }

        /* welcome title styles */
        .welcome-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #1E1E1E;
            margin-top: 0.5rem;
            margin-bottom: 0.1rem;
            text-align: center;
            line-height: 1.2;
        }

        .dark .welcome-title {
            color: white;
        }

        .welcome-subtitle {
            font-size: 0.8rem;
            color: rgba(30, 30, 30, 0.7);
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .dark .welcome-subtitle {
            color: #9CA3AF;
        }

        /* terms text style */
        .terms-text {
            font-size: 0.7rem;
            color: #6B7280;
        }

        .dark .terms-text {
            color: #9CA3AF;
        }

        .terms-link {
            color: #D4AF37;
            font-weight: 500;
            text-decoration: none;
        }

        .terms-link:hover {
            text-decoration: underline;
            color: #B22222;
        }

        .dark .terms-link {
            color: #D4AF37;
        }

        /* divider refined */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0 1rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #EAE0D0;
        }

        .dark .divider::before,
        .dark .divider::after {
            border-bottom-color: #2F2F2F;
        }

        .divider span {
            font-size: 0.75rem;
            padding: 0 1rem;
            color: #7A1A1A;
            font-weight: 600;
            text-transform: lowercase;
            letter-spacing: 0.05em;
        }

        .dark .divider span {
            color: #D4AF37;
        }

        /* spacing adjustments */
        .space-y-4> :not([hidden])~ :not([hidden]) {
            margin-top: 0.75rem;
        }

        form .space-y-4 {
            margin-bottom: 0.25rem;
        }

        /* mobile friendly */
        @media (max-width: 380px) {
            .signup-card {
                padding: 1.2rem 1.2rem 1.5rem;
            }

            .welcome-title {
                font-size: 1.3rem;
            }

            .social-btn-row {
                gap: 0.75rem;
            }

            .social-btn {
                padding: 0.5rem 0.3rem;
                font-size: 0.8rem;
                gap: 0.4rem;
            }

            .social-btn i {
                font-size: 1rem;
            }

            .signup-input {
                padding: 0.6rem 1rem 0.6rem 2.8rem;
                font-size: 0.85rem;
            }

            .toggle-password {
                right: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .theme-toggle-wrapper {
                top: 12px;
                right: 12px;
            }

            [dir="rtl"] .theme-toggle-wrapper {
                left: 12px;
            }
        }

        @media (min-width: 900px) and (max-width: 1200px) and (max-height: 700px) {
            .signup-card {
                transform: scale(0.9);
            }
        }
    </style>
</head>

<body class="bg-white dark:bg-black">

    <!-- ===== THEME TOGGLES - TOP-RIGHT ===== -->
    <div class="theme-toggle-wrapper">
        <button id="theme-toggle" class="toggle-btn" title="Dark / Light">
            <i class="fas fa-sun"></i>
        </button>
        <button id="rtl-toggle" class="toggle-btn" title="RTL / LTR">
            ⇄
        </button>
    </div>

    <!-- ===== SIGNUP CARD ===== -->
    <div class="container-tight">

        <!-- SIGNUP CARD -->
        <div class="signup-card animate-fade-in">

            <!-- ===== LOGO - CENTERED ===== -->
            <div class="logo-center">
                <a href="index.html" class="flex items-center space-x-3 group">
                    <div class="w-10 h-10 bg-dojo-red dark:bg-dojo-red flex items-center justify-center rounded-lg">
                        <i class="fas fa-fist-raised text-white text-xl"></i>
                    </div>
                    <div>
                        <span class="text-2xl font-heading font-bold text-dojo-red dark:text-dojo-red">Little Warriors</span>
                    </div>
                </a>

                <h6 class="welcome-title">Begin Your Journey</h6>
                <p class="welcome-subtitle">Create an account to enroll your little warrior</p>
            </div>

            <!-- ===== SIGNUP FORM with EYE ICON on password fields ===== -->
            <form class="space-y-4"
                onsubmit="event.preventDefault(); alert('🎉 Welcome to Little Warriors! Your account has been created. (Demo)'); window.location.href='login.html';">

                <!-- full name field -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-dojo-gold dark:text-dojo-gold input-icon">
                        <i class="fas fa-user w-4 text-sm"></i>
                    </span>
                    <input type="text" name="name" placeholder="Full name" required class="signup-input text-sm md:text-sm">
                </div>

                <!-- email field -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-dojo-gold dark:text-dojo-gold input-icon">
                        <i class="fas fa-envelope w-4 text-sm"></i>
                    </span>
                    <input type="email" name="email" placeholder="Email address" required class="signup-input text-sm md:text-sm">
                </div>

                <!-- password field with eye icon -->
                <div class="password-wrapper">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-dojo-gold dark:text-dojo-gold input-icon">
                        <i class="fas fa-lock w-4 text-sm"></i>
                    </span>
                    <input type="password" id="signup-password" name="password" placeholder="Password" required class="signup-input text-sm md:text-sm">
                    <button type="button" class="toggle-password" data-target="signup-password" aria-label="Show password">
                        <i class="far fa-eye-slash"></i>
                    </button>
                </div>

                <!-- confirm password field with eye icon -->
                <div class="password-wrapper">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-dojo-gold dark:text-dojo-gold input-icon">
                        <i class="fas fa-lock w-4 text-sm"></i>
                    </span>
                    <input type="password" id="signup-confirm-password" name="confirm_password" placeholder="Confirm password" required class="signup-input text-sm md:text-sm">
                    <button type="button" class="toggle-password" data-target="signup-confirm-password" aria-label="Show password">
                        <i class="far fa-eye-slash"></i>
                    </button>
                </div>

                <!-- terms and conditions checkbox -->
                <div class="flex items-start space-x-2 rtl:space-x-reverse mt-1">
                    <input type="checkbox" id="terms" class="mt-0.5 rounded border-dojo-sand dark:border-gray-600 text-dojo-gold focus:ring-dojo-gold/30 dark:bg-gray-700" required>
                    <label for="terms" class="terms-text text-xs text-dojo-ink/80 dark:text-gray-400">
                        I agree to the <a href="#" class="terms-link">Terms of Service</a> and <a href="#" class="terms-link">Privacy Policy</a>
                    </label>
                </div>

                <!-- SIGN UP BUTTON -->
                <button type="submit" class="heritage-btn mt-1">
                    <i class="fas fa-user-plus mr-2 rtl:ml-2 rtl:mr-0"></i>
                    Create Account
                </button>
            </form>

            <!-- ===== Divider + Social Options (Google & Apple) ===== -->
            <div class="divider">
                <span>or sign up with</span>
            </div>

            <div class="social-btn-row">
                <button class="social-btn group" id="googleSignupBtn">
                    <i class="fab fa-google"></i>
                    <span>Google</span>
                </button>
                <button class="social-btn group" id="appleSignupBtn">
                    <i class="fab fa-apple"></i>
                    <span>Apple</span>
                </button>
            </div>

            <!-- ===== LOGIN LINK ===== -->
            <div class="mt-4 text-center">
                <span class="text-xs text-dojo-ink/80 dark:text-gray-400">Already have an account?</span>
                <a href="login.html" class="text-xs font-semibold text-dojo-gold dark:text-dojo-gold hover:text-dojo-red ml-1 rtl:mr-1 hover:underline">
                    Sign in
                </a>
            </div>

        </div>
    </div>

    <!-- ===== DARK / LIGHT + RTL TOGGLE SCRIPT + EYE ICON FUNCTIONALITY ===== -->
    <script>
            (function () {
                // ---------- THEME ----------
                const themeToggle = document.getElementById('theme-toggle');

                function setTheme(isDark) {
                    if (isDark) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }

                    const icon = themeToggle?.querySelector('i');
                    if (icon) {
                        icon.classList.remove('fa-sun', 'fa-moon');
                        icon.classList.add(isDark ? 'fa-moon' : 'fa-sun');
                    }

                    if (isDark) {
                        themeToggle?.classList.add('active');
                        localStorage.setItem('theme', 'dark');
                    } else {
                        themeToggle?.classList.remove('active');
                        localStorage.setItem('theme', 'light');
                    }
                }

                // Check for saved theme or system preference
                const savedTheme = localStorage.getItem('theme');
                if (savedTheme === 'dark') {
                    setTheme(true);
                } else if (savedTheme === 'light') {
                    setTheme(false);
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    setTheme(true);
                } else {
                    setTheme(false);
                }

                if (themeToggle) {
                    themeToggle.addEventListener('click', (e) => {
                        e.preventDefault();
                        setTheme(!document.documentElement.classList.contains('dark'));
                    });
                }

                // ---------- RTL ----------
                const rtlBtn = document.getElementById('rtl-toggle');
                function setRTL(isRTL) {
                    if (isRTL) {
                        document.documentElement.dir = 'rtl';
                        document.documentElement.lang = 'ar';
                        rtlBtn?.classList.add('active');
                        localStorage.setItem('dir', 'rtl');
                    } else {
                        document.documentElement.dir = 'ltr';
                        document.documentElement.lang = 'en';
                        rtlBtn?.classList.remove('active');
                        localStorage.setItem('dir', 'ltr');
                    }
                }
                const savedDir = localStorage.getItem('dir');
                savedDir === 'rtl' ? setRTL(true) : setRTL(false);

                if (rtlBtn) {
                    rtlBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        setRTL(document.documentElement.dir !== 'rtl');
                    });
                }

                // ---------- EYE ICON TOGGLE PASSWORD VISIBILITY ----------
                const toggleButtons = document.querySelectorAll('.toggle-password');
                toggleButtons.forEach(button => {
                    button.addEventListener('click', function (e) {
                        e.preventDefault();
                        const targetId = this.getAttribute('data-target');
                        const passwordInput = document.getElementById(targetId);
                        if (passwordInput) {
                            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                            passwordInput.setAttribute('type', type);
                            // Toggle eye icon
                            const icon = this.querySelector('i');
                            if (icon) {
                                if (type === 'text') {
                                    icon.classList.remove('fa-eye-slash');
                                    icon.classList.add('fa-eye');
                                } else {
                                    icon.classList.remove('fa-eye');
                                    icon.classList.add('fa-eye-slash');
                                }
                            }
                        }
                    });
                });

                // ---------- SOCIAL BUTTONS (Google & Apple) interactive demo ----------
                const googleBtn = document.getElementById('googleSignupBtn');
                const appleBtn = document.getElementById('appleSignupBtn');

                if (googleBtn) {
                    googleBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        alert('🥋 Google sign-up demo: In production, this would redirect to Google OAuth.');
                    });
                }
                if (appleBtn) {
                    appleBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        alert('🥋 Apple sign-up demo: In production, this would initiate Apple ID authentication.');
                    });
                }

                // ---------- DEMO ALERTS (Terms & Privacy) ----------
                document.querySelectorAll('.terms-link').forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        alert('📜 Terms of Service & Privacy Policy demo - full legal document would be shown.');
                    });
                });

                // ---------- Password match hint on submit ----------
                const signupForm = document.querySelector('form');
                if (signupForm) {
                    signupForm.addEventListener('submit', function (e) {
                        const password = document.getElementById('signup-password')?.value;
                        const confirm = document.getElementById('signup-confirm-password')?.value;
                        const termsCheck = document.getElementById('terms');
                        if (password !== confirm) {
                            e.preventDefault();
                            alert('⚠️ Passwords do not match. Please re-enter your password.');
                            return false;
                        }
                        if (!termsCheck.checked) {
                            e.preventDefault();
                            alert('📜 Please accept the Terms of Service and Privacy Policy to continue.');
                            return false;
                        }
                        return true;
                    });
                }
            })();
    </script>
</body>

</html>
