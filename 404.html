<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Little Warriors Martial Arts</title>
    <link rel="icon" type="image/svg+xml" href="assest/favicon.svg">
    <meta name="description" content="Page not found. The page you're looking for doesn't exist or has been moved.">

    <!-- Tailwind CSS -->

    <script>
        if (typeof tailwind === 'undefined') {
            document.write('<script src="https://cdn.tailwindcss.com"><\/script>');
        }
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'dojo-red': '#B22222',
                        'dojo-red-light': '#D44A4A',
                        'dojo-red-dark': '#7A1A1A',
                        'dojo-gold': '#D4AF37',
                        'dojo-parchment': '#FDF8F0',
                        'dojo-ink': '#1E1E1E',
                        'dojo-sand': '#EAE0D0',
                        'dojo-blue': '#1F3A5F',
                        'dojo-blue-light': '#2F5A8F',
                        'dojo-wood': '#8B5E3C',
                    },
                    fontFamily: {
                        'serif': ['Libre Baskerville', 'Georgia', 'serif'],
                        'heading': ['Playfair Display', 'serif'],
                        'body': ['Lato', 'system-ui', 'sans-serif'],
                        'script': ['Great Vibes', 'cursive'],
                        'alt-serif': ['Libre Baskerville', 'serif'],
                        'sans': ['Lato', 'Inter', 'sans-serif'],
                    },

            }
        }
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800;900&family=Lato:wght@300;400;700;900&family=Great+Vibes&family=Libre+Baskerville:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background: #FFFFFF;
            font-family: 'Lato', sans-serif;
            color: #1E1E1E;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .dark body {
            background: #0A0A0A;
            color: #EDE4D8;
        }

        p {
            line-height: 1.8;
            letter-spacing: 0.01em;
        }

        h1, h2, h3, h4, .heading-font {
            font-family: 'Playfair Display', serif;
        }

        /* Toggle Buttons */
        .toggle-btn {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            background: #EAE0D0;
            color: #7A1A1A;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .dark .toggle-btn {
            background: #1A1A1A;
            color: #D4AF37;
        }

        .toggle-btn:hover {
            background: #B22222;
            color: white;
        }

        .dark .toggle-btn:hover {
            background: #D4AF37;
            color: #1E1E1E;
        }

        /* ========== RTL FIXES ========== */
        [dir="rtl"] {
            direction: rtl;
        }

        [dir="rtl"] .space-x-3 > :not([hidden]) ~ :not([hidden]) {
            --tw-space-x-reverse: 1;
            margin-right: calc(0.75rem * var(--tw-space-x-reverse));
            margin-left: calc(0.75rem * calc(1 - var(--tw-space-x-reverse)));
        }

        [dir="rtl"] .gap-8 {
            gap: 2rem;
        }

        [dir="rtl"] .ml-8 {
            margin-left: 0;
            margin-right: 2rem;
        }

        [dir="rtl"] .ml-4 {
            margin-left: 0;
            margin-right: 1rem;
        }

        [dir="rtl"] .mr-2 {
            margin-right: 0;
            margin-left: 0.5rem;
        }

        [dir="rtl"] .mr-1 {
            margin-right: 0;
            margin-left: 0.25rem;
        }

        [dir="rtl"] .dropdown-menu {
            left: auto;
            right: 0;
        }

        [dir="rtl"] .dropdown-item i {
            margin-right: 0;
            margin-left: 0.75rem;
        }

        [dir="rtl"] .flex.items-center.gap-3 {
            gap: 0.75rem;
        }

        [dir="rtl"] .desktop-toggle-group {
            flex-direction: row;
        }

        [dir="rtl"] .border-l-4 {
            border-left-width: 0;
            border-right-width: 4px;
        }

        [dir="rtl"] .rounded-r-lg {
            border-radius: 0.5rem 0 0 0.5rem;
        }

        [dir="rtl"] .heritage-line {
            margin: 1rem auto;
        }

        [dir="rtl"] .pl-3 {
            padding-left: 0;
            padding-right: 0.75rem;
        }

        [dir="rtl"] .footer-heading {
            border-right: 4px solid #D4AF37;
            border-left: none;
            padding-right: 0.75rem;
            padding-left: 0;
        }

        [dir="rtl"] .footer-contact-item {
            gap: 0.75rem;
            display: flex;
            align-items: center;
        }

        [dir="rtl"] .footer-contact-item i {
            margin: 0;
        }

        @media (min-width: 768px) {
            [dir="rtl"] .footer-contact-item {
                justify-content: flex-start;
            }
        }

        @media (max-width: 767px) {
            [dir="rtl"] .footer-contact-item {
                justify-content: center;
            }
        }

        /* Button styles */
        .btn-primary {
            background: #B22222;
            color: white;
            padding: 0.8rem 2rem;
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            transition: all 0.3s;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .dark .btn-primary {
            background: #D4AF37;
            color: #1E1E1E;
        }

        .btn-primary:hover {
            background: #7A1A1A;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .btn-secondary {
            border: 1px solid #D4AF37;
            background: transparent;
            color: #7A1A1A;
            padding: 0.75rem 1.8rem;
            border-radius: 8px;
            font-family: 'Playfair Display', serif;
            font-weight: 500;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .dark .btn-secondary {
            color: #D4AF37;
        }

        .btn-secondary:hover {
            background: #D4AF37;
            color: white;
        }

        .dark .btn-secondary:hover {
            background: #D4AF37;
            color: #1E1E1E;
        }

        .heritage-line {
            width: 70px;
            height: 3px;
            background: #D4AF37;
            margin: 1rem auto;
        }
    </style>
</head>
<body class="bg-white dark:bg-black">

    <!-- ========== HEADER - LOGO AND TOGGLE BTNS ========== -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-white/95 dark:bg-[#121212]/95 backdrop-blur-md border-b border-dojo-gold/30">
        <div class="container mx-auto px-6">
            <div class="flex items-center justify-between h-20">
                <!-- Logo -->
                <a href="index.html" class="flex items-center space-x-3 group">
                    <div class="w-10 h-10 bg-dojo-red dark:bg-dojo-red flex items-center justify-center rounded-lg">
                        <i class="fas fa-fist-raised text-white text-xl"></i>
                    </div>
                    <div>
                        <span class="text-2xl font-heading font-bold text-dojo-red dark:text-dojo-red">Little Warriors</span>
                    </div>
                </a>

                <!-- Only Toggle Buttons -->
                <div class="flex items-center gap-3">
                    <button id="theme-toggle" class="toggle-btn" title="Theme">
                        <i class="fas fa-moon"></i>
                        <i class="fas fa-sun" style="display:none"></i>
                    </button>
                    <button id="rtl-toggle" class="toggle-btn" title="RTL">
                        ⇄
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- ========== 404 MAIN CONTENT ========== -->
    <div class="min-h-screen flex items-center justify-center pt-32 pb-16 px-6">
        <div class="max-w-2xl mx-auto text-center">
            <!-- Large 404 Number -->
            <div class="mb-6">
                <span class="text-[140px] md:text-[200px] font-heading font-black text-dojo-gold leading-none tracking-tighter">404</span>
            </div>

            <!-- Icon -->
            <div class="w-20 h-20 bg-dojo-gold/10 rounded-2xl flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-fist-raised text-dojo-gold text-3xl"></i>
            </div>

            <!-- Title -->
            <h1 class="text-3xl md:text-4xl font-heading font-bold text-dojo-ink dark:text-white mb-3">
                Oops! This Page Took a Wrong Turn
            </h1>

            <!-- Divider -->
            <div class="heritage-line"></div>

            <!-- Message -->
            <p class="text-lg md:text-xl font-serif text-dojo-ink/70 dark:text-dojo-parchment/70 mb-8 leading-relaxed">
                Even the best warriors sometimes lose their way.<br>
                The page you're looking for doesn't exist or has been moved.
            </p>

            <!-- Action Buttons -->
            <div class="flex flex-wrap gap-4 justify-center mb-10">
                <a href="index.html" class="btn-primary">
                    <i class="fas fa-home"></i> Back to Home
                </a>
                <a href="contact.html" class="btn-secondary">
                    <i class="fas fa-envelope"></i> Contact Support
                </a>
            </div>

            <!-- Quick Links -->
            <div class="border-t border-dojo-gold/20 pt-8">
                <p class="text-sm font-serif text-dojo-ink/50 dark:text-dojo-parchment/50 mb-4">
                    <i class="fas fa-compass text-dojo-gold mr-2"></i> Quick Navigation
                </p>
                <div class="flex flex-wrap gap-4 justify-center">
                    <a href="about.html" class="text-sm font-serif text-dojo-ink/60 dark:text-dojo-parchment/60 hover:text-dojo-gold transition">About Us</a>
                    <span class="text-dojo-gold/30">|</span>
                    <a href="programs.html" class="text-sm font-serif text-dojo-ink/60 dark:text-dojo-parchment/60 hover:text-dojo-gold transition">Programs</a>
                    <span class="text-dojo-gold/30">|</span>
                    <a href="schedule.html" class="text-sm font-serif text-dojo-ink/60 dark:text-dojo-parchment/60 hover:text-dojo-gold transition">Schedule</a>
                    <span class="text-dojo-gold/30">|</span>
                    <a href="contact.html" class="text-sm font-serif text-dojo-ink/60 dark:text-dojo-parchment/60 hover:text-dojo-gold transition">Contact</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Theme Toggle
            const themeBtn = document.getElementById('theme-toggle');
            const themeBtnMob = document.getElementById('theme-toggle-mobile');

            const updateThemeUI = (isDark) => {
                [themeBtn, themeBtnMob].forEach(b => {
                    if(b) {
                        const moon = b.querySelector('.fa-moon');
                        const sun = b.querySelector('.fa-sun');
                        if(moon && sun) {
                            if(isDark) { moon.style.display = 'none'; sun.style.display = 'inline-block'; }
                            else { moon.style.display = 'inline-block'; sun.style.display = 'none'; }
                        }
                        b.classList.toggle('active', isDark);
                    }
                });
            };

            const toggleTheme = () => {
                document.documentElement.classList.toggle('dark');
                const isDark = document.documentElement.classList.contains('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                updateThemeUI(isDark);
            };

            if(themeBtn) themeBtn.addEventListener('click', toggleTheme);
            if(themeBtnMob) themeBtnMob.addEventListener('click', toggleTheme);

            if(localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark');
                updateThemeUI(true);
            }

            // RTL Toggle
            const rtlBtn = document.getElementById('rtl-toggle');
            const rtlMob = document.getElementById('rtl-toggle-mobile');

            const updateRtlUI = (isRtl) => {
                const dir = isRtl ? 'rtl' : 'ltr';
                document.documentElement.dir = dir;
                document.documentElement.lang = isRtl ? 'ar' : 'en';
                [rtlBtn, rtlMob].forEach(b => b && b.classList.toggle('active', isRtl));
            };

            const toggleRtl = () => {
                const isRtl = document.documentElement.dir !== 'rtl';
                localStorage.setItem('dir', isRtl ? 'rtl' : 'ltr');
                updateRtlUI(isRtl);
            };

            if(rtlBtn) rtlBtn.addEventListener('click', toggleRtl);
            if(rtlMob) rtlMob.addEventListener('click', toggleRtl);

            if(localStorage.getItem('dir') === 'rtl') {
                updateRtlUI(true);
            }
        });
    </script>
</body>
</html>
